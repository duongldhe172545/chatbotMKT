[pytest]
# Em Linh MKT v8 — test pyramid (refer KE_HOACH § 0.10)

testpaths =
    tests/unit
    tests/integration
    tests/e2e

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support (pytest-asyncio)
asyncio_mode = auto

# Verbose output cho dev local
addopts =
    -v
    --tb=short
    --strict-markers

# Markers (refer test pyramid)
markers =
    unit: Pure function tests, no IO (validators, slot definitions, intent markers)
    integration: Mock LLM + in-memory DB (state machine, extractor runner, guard pipeline)
    e2e: Full flow với real LLM — chậm, ít chạy (Phase 1 happy case)
    slow: Tests > 1s, skip default trong CI nếu cần
